title: Plan
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: price
            field:
              type: text
              required: true
              display: Price
          -
            handle: currency
            field:
              type: text
              display: Currency symbol
              default: '$'
          -
            handle: period
            field:
              type: text
              display: Period
              default: month
          -
            handle: features
            field:
              type: grid
              display: Features
              fields:
                -
                  handle: feature
                  field:
                    type: text
                    display: Feature
          -
            handle: button_label
            field:
              type: text
              display: Button label
              default: Buy Now
          -
            handle: button_url
            field:
              type: link
              display: Button link
