{{# FAQ accordion — matches faq.html layout + accessible toggles #}}
<section class="faq-section">
	<div class="container">
		<div class="faq-title">
			{{ if heading }}<h2 class="title-rg" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h2>{{ /if }}
			{{ if text }}<p data-aos="fade-up" data-aos-duration="1000">{{ text }}</p>{{ /if }}
			<div class="search_con" data-aos="fade-up" data-aos-duration="1000">
				<form action="/search" method="get" class="input_con" role="search">
					<label for="queryFind" class="visually-hidden">Search FAQs</label>
					<input type="search" name="q" placeholder="Search here..." spellcheck="false" id="queryFind" autocomplete="off">
					<button type="button" id="clearBtn" aria-label="Clear search">
						<img src="/assets/image/search.svg" class="img-1" alt="" aria-hidden="true">
					</button>
				</form>
			</div>
		</div>
		<div class="faq-accodian-main">
			<div class="accordion">
				{{ collection:faqs }}
				<div class="accordion-item" data-faq-item>
					<button type="button" class="accordion-tabs" aria-expanded="false" aria-controls="faq-{{ id }}">
						{{ title }}<span aria-hidden="true"></span>
					</button>
					<div class="accordion-content" id="faq-{{ id }}" style="display: none;">
						{{ if body }}
						{{ body | markdown }}
						{{ /if }}
					</div>
				</div>
				{{ /collection:faqs }}
			</div>
		</div>
	</div>
</section>
