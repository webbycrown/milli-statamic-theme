{{# Blog slider — large image + text (milli-3.html) #}}
<section class="blog-section">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="blog-title">
					{{ if heading }}<h2 class="title-rg mb-0" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h2>{{ /if }}
				</div>
				<div class="blog-wrapper">
					<div class="swiper blog-swiper">
						<div class="swiper-wrapper">
							{{ collection:culture limit="6" }}
							<div class="swiper-slide">
								<div class="blog-wrap">
									{{ if image }}
									<div class="blog-img">
										<div class="blog-img-item">
											<img data-aos="zoom-in" data-aos-duration="1000" src="{{ partial:partials/media-url :file="image" }}" alt="{{ title }}">
										</div>
									</div>
									{{ /if }}
									<div class="blog-contant">
										<div class="blog-contant-item">
											<p>{{ date format="d M, Y" }} - No Comments</p>
											<h3 data-aos="fade-left" data-aos-duration="1000">{{ title }}</h3>
											<div class="hero-button" data-aos="fade-right" data-aos-duration="1500">
												<a href="{{ url }}" class="btn btn-primary">
													<span>Explore</span>
												</a>
											</div>
										</div>
									</div>
								</div>
							</div>
							{{ /collection:culture }}
						</div>
						<div class="edition-swiper-geers">
							<div class="swiper-button-prev">
								<img src="/assets/image/edition-swiper-arrow.png" alt="" aria-hidden="true">
							</div>
							<div class="swiper-button-next">
								<img src="/assets/image/edition-swiper-arrow.png" alt="" aria-hidden="true">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
