{{# All pages hero (all-layout-presantation.html all-layout-pre-page) #}}
<section class="all-layout-pre-page">
	<div class="container">
		<div class="all-layout-title">
			{{ if heading }}
			<h1 class="title-rg" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h1>
			{{ else }}
			<h1 class="title-rg" data-aos="fade-up" data-aos-duration="1000">All pages</h1>
			{{ /if }}
			{{ if text }}
			<p data-aos="fade-left" data-aos-duration="1000">{{ text }}</p>
			{{ /if }}
			{{ if button_label }}
			<div class="hero-button" data-aos="fade-right" data-aos-duration="1500">
				<a href="{{ button_url or '/' }}" class="btn btn-primary">
					<span>{{ button_label }}</span>
				</a>
			</div>
			{{ /if }}
		</div>
	</div>
</section>
