{{# Editions slider — paired magazine images in a Swiper (index.html) #}}
<section class="edition-section">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="edition-title">
					{{ if heading }}<h2 class="title-rg mb-0" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h2>{{ /if }}
				</div>
				<div class="edition-wrapper">
					<div class="swiper edition-swiper">
						<div class="swiper-wrapper">
							{{ collection:editions limit="8" }}
							<div class="swiper-slide">
								<div class="edition-item">
									{{ if image }}
									<div class="img img-1" data-aos="zoom-in" data-aos-duration="1000"><img src="{{ partial:partials/media-url :file="image" }}" alt="{{ title }}"></div>
									{{ /if }}
									{{ if image_two }}
									<div class="img img-2" data-aos="zoom-in" data-aos-duration="1200"><img src="{{ partial:partials/media-url :file="image_two" }}" alt="{{ title }}"></div>
									{{ /if }}
								</div>
							</div>
							{{ /collection:editions }}
						</div>
						<div class="edition-swiper-geers">
							<div class="swiper-button-prev">
								<img src="/assets/image/edition-swiper-arrow.png" alt="" aria-hidden="true">
							</div>
							<div class="swiper-button-next">
								<img src="/assets/image/edition-swiper-arrow.png" alt="" aria-hidden="true">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
