{{# Unique home pages showcase (all-layout-presantation.html) #}}
<section class="unique-home-pages-section">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="unique-layout-title">
					{{ if heading }}<h2 class="title-rg" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h2>{{ /if }}
				</div>
				{{ if homes }}
				<div class="unique-pages-wrappp">
					<div class="unique-pages-group">
						{{ homes }}
						<div class="unique-pages-item" data-aos="{{ if first }}fade-right{{ elseif last }}fade-left{{ else }}zoom-in{{ /if }}" data-aos-duration="1000">
							<div class="unique-pages-item-wrap">
								{{ if link }}
								<a href="{{ link }}" class="img-txt">
									{{ if image }}
									<img src="{{ partial:partials/media-url :file="image" }}" alt="{{ title }}">
									{{ /if }}
									<span class="btn btn-primary"><span>View Page</span></span>
								</a>
								{{ /if }}
								{{ if title }}<h4>{{ title }}</h4>{{ /if }}
							</div>
						</div>
						{{ /homes }}
					</div>
				</div>
				{{ /if }}
			</div>
		</div>
	</div>
	<div class="cursor" aria-hidden="true"><img src="/assets/image/Drag.png" alt=""></div>
</section>
